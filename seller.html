<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كن بائعاً | شُرَاك</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="seller">
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 48 48" fill="none"><path d="M12 14C12 10.6863 14.6863 8 18 8H30C33.3137 8 36 10.6863 36 14V18H40C42.2091 18 44 19.7909 44 22V38C44 40.2091 42.2091 42 40 42H8C5.79086 42 4 40.2091 4 38V22C4 19.7909 5.79086 18 8 18H12V14Z" fill="#0A2540"/><path d="M16 22H32V38H16V22Z" fill="#1E6BFF"/><path d="M20 14H28V22H20V14Z" fill="#0A2540"/><circle cx="24" cy="30" r="4" fill="white"/></svg>
        </div>
        <div class="logo-text"><span class="logo-name">شُرَاك</span><span class="logo-sub">SHURAK</span></div>
      </a>
      <div class="header-actions">
        <a href="products.html" class="btn btn-ghost">المنتجات</a>
        <button id="loginBtn" class="btn btn-outline">دخول Google</button>
        <a href="account.html" id="accountBtn" class="btn btn-ghost hidden">
          <img id="userAvatar" src="" class="avatar" /><span id="userName">حسابي</span>
        </a>
        <a href="cart.html" class="btn btn-cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span id="cartCount" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>لوحة البائع</h1>
      <p>أضف منتجاتك وابدأ البيع للطلاب</p>
    </div>
  </div>

  <div class="container">
    <div id="sellerGuest" class="form-card">
      <h2>سجّل دخولك أولاً</h2>
      <p class="subtitle">للبدء في بيع منتجاتك يجب تسجيل الدخول بحساب Google</p>
      <button class="btn btn-primary btn-block" onclick="loginWithGoogle()">دخول بواسطة Google</button>
    </div>

    <div id="sellerContent" class="hidden">
      <div class="form-card">
        <h2>إضافة منتج جديد</h2>
        <p class="subtitle">املأ البيانات بدقة. المنتجات تظهر فوراً في المتجر.</p>

        <form id="addProductForm">
          <div class="form-group">
            <label>اسم المنتج *</label>
            <input type="text" id="prodName" required placeholder="مثال: سماعة لاسلكية" />
          </div>
          <div class="form-group">
            <label>الوصف *</label>
            <textarea id="prodDesc" rows="3" required placeholder="حالة المنتج، المميزات، أي ملاحظات..."></textarea>
          </div>
          <div class="form-group">
            <label>السعر (ريال) *</label>
            <input type="number" id="prodPrice" min="1" step="1" required placeholder="75" />
          </div>
          <div class="form-group">
            <label>القسم *</label>
            <select id="prodCategory" required>
              <option value="إلكترونيات">إلكترونيات</option>
              <option value="أزياء">أزياء</option>
              <option value="كتب">كتب</option>
              <option value="ألعاب">ألعاب</option>
              <option value="أخرى">أخرى</option>
            </select>
          </div>
          <div class="form-group">
            <label>أيقونة (إيموجي)</label>
            <input type="text" id="prodEmoji" placeholder="🎧 أو 📚 أو 👟" maxlength="4" />
          </div>

          <!-- الشروط والأحكام -->
          <div class="checkbox-group">
            <input type="checkbox" id="acceptTerms" required />
            <label for="acceptTerms">
              أوافق على <a href="terms.html" target="_blank">الشروط والأحكام</a> وأتعهد بأن المنتج ملك لي وأن المعلومات صحيحة، وأتحمل المسؤولية الكاملة عن أي نزاع.
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block">نشر المنتج</button>
        </form>
      </div>

      <div class="form-card seller-products">
        <h2>منتجاتي</h2>
        <div id="myProductsList"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="terms.html">الشروط والأحكام</a>
      </div>
      <p>© 2026 شُرَاك التجاري</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
