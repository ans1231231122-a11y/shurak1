<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>السلة | شُرَاك</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body data-page="cart">
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 48 48" fill="none"><path d="M12 14C12 10.6863 14.6863 8 18 8H30C33.3137 8 36 10.6863 36 14V18H40C42.2091 18 44 19.7909 44 22V38C44 40.2091 42.2091 42 40 42H8C5.79086 42 4 40.2091 4 38V22C4 19.7909 5.79086 18 8 18H12V14Z" fill="#0A2540"/><path d="M16 22H32V38H16V22Z" fill="#1E6BFF"/><path d="M20 14H28V22H20V14Z" fill="#0A2540"/><circle cx="24" cy="30" r="4" fill="white"/></svg>
        </div>
        <div class="logo-text"><span class="logo-name">شُرَاك</span><span class="logo-sub">SHURAK</span></div>
      </a>
      <div class="header-actions">
        <a href="products.html" class="btn btn-ghost">المنتجات</a>
        <button id="loginBtn" class="btn btn-outline">دخول Google</button>
        <a href="account.html" id="accountBtn" class="btn btn-ghost hidden">
          <img id="userAvatar" src="" class="avatar" /><span id="userName">حسابي</span>
        </a>
        <a href="cart.html" class="btn btn-cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span id="cartCount" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>سلة المشتريات</h1>
      <p>راجع منتجاتك واختر طريقة الدفع</p>
    </div>
  </div>

  <div class="container" style="padding-bottom:50px">
    <div id="emptyCart" class="empty-state hidden">
      <div class="icon">🛒</div>
      <p>سلتك فارغة</p>
      <a href="products.html" class="btn btn-primary" style="margin-top:16px">تصفح المنتجات</a>
    </div>

    <div id="cartContent" class="cart-layout">
      <div class="cart-items-list" id="cartItemsList"></div>

      <div class="cart-summary">
        <h3>ملخص الطلب</h3>
        <div class="summary-row"><span>المجموع الفرعي</span><span id="cartTotal">0 ريال</span></div>
        <div class="summary-row"><span>الشحن</span><span>يُحدد لاحقاً</span></div>

        <!-- الثلاث خيارات -->
        <div class="payment-options">
          <h4>اختر طريقة الدفع</h4>
          <label class="payment-option selected">
            <input type="radio" name="payment" value="cod" checked />
            <div>
              <strong>الدفع عند الاستلام</strong>
              <div style="font-size:0.82rem;color:var(--text-muted)">ادفع نقداً عند استلام المنتج</div>
            </div>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="transfer" />
            <div>
              <strong>تحويل بنكي</strong>
              <div style="font-size:0.82rem;color:var(--text-muted)">حوّل على حساب البائع بعد الاتفاق</div>
            </div>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="later" />
            <div>
              <strong>دفع إلكتروني لاحقاً</strong>
              <div style="font-size:0.82rem;color:var(--text-muted)">سيتم تفعيل بوابة الدفع قريباً</div>
            </div>
          </label>
        </div>

        <div class="summary-total summary-row">
          <span>الإجمالي</span>
          <span id="cartTotal2">—</span>
        </div>

        <button id="placeOrderBtn" class="btn btn-primary btn-block" style="margin-top:16px">تأكيد الطلب</button>
        <a href="products.html" class="btn btn-outline btn-block" style="margin-top:10px">متابعة التسوق</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="terms.html">الشروط والأحكام</a>
      </div>
      <p>© 2026 شُرَاك التجاري</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    // تحديث الإجمالي الثاني
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new MutationObserver(() => {
        const t = document.getElementById("cartTotal");
        const t2 = document.getElementById("cartTotal2");
        if (t && t2) t2.textContent = t.textContent;
      });
      const target = document.getElementById("cartTotal");
      if (target) observer.observe(target, { childList: true, characterData: true, subtree: true });
    });
  </script>
</body>
</html>
